<!doctype html>
<html lang="ml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malayalam Christian Song Lyrics</title>
    <meta
      name="description"
      content="A clean, fast-loading, mobile-responsive Malayalam Christian hymnal and song lyrics reader that dynamically loads and parses songs from songs.txt."
    />
    <meta property="og:title" content="Malayalam Christian Song Lyrics" />
    <meta
      property="og:description"
      content="A clean, fast-loading, mobile-responsive Malayalam Christian hymnal and song lyrics reader that dynamically loads and parses songs from songs.txt."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('hymnal-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F4] text-[#1C1917] dark:bg-[#111110] dark:text-[#F4F1EA] antialiased selection:bg-[#7C2D12]/15 selection:text-[#1C1917] dark:selection:bg-[#D97706]/30 dark:selection:text-[#F4F1EA]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
